name: Build IPAUtility

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ipautility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          python3 scripts/make_fixtures.py
          xcodegen generate
      - name: Build unsigned app and thumbnail extension
        run: |
          set -o pipefail
          xcodebuild -project IPAUtility.xcodeproj -scheme IPAUtility \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' build | tee build-device.log
      - name: Run parser and rename tests
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for runtime,ds in d["devices"].items() if "iOS" in runtime for x in ds if "iPhone" in x["name"]))')
          xcodebuild -project IPAUtility.xcodeproj -scheme IPAUtility \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test | tee build-tests.log
      - name: Package and check IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPAUtility.app Payload/
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' Payload/IPAUtility.app/PlugIns/IPAThumbnail.appex/Info.plist
          zip -qry IPAUtility-Unsigned.ipa Payload
          python3 scripts/verify_package.py IPAUtility-Unsigned.ipa
          shasum -a 256 IPAUtility-Unsigned.ipa > IPAUtility-SHA256.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPAUtility-Unsigned
          path: |
            IPAUtility-Unsigned.ipa
            IPAUtility-SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            build-device.log
            build-tests.log
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
